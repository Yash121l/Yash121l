name: Update upstream table

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update-upstream.mjs]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "Yash Lunawat"
          git config user.email "yash.lunawat@rtp.vc"
          git add README.md
          git diff --cached --quiet || git commit -m "readme: refresh upstream table"
          git push
